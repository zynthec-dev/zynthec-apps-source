name: Update source for Cloudflare
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      upload_manifest:
        description: Admin upload manifest
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: source-publish
  cancel-in-progress: false
jobs:
  source:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test admin API authorization
        run: node --test tests/admin-api.test.mjs
      - name: Render current settings
        run: python3 scripts/source.py render
      - name: Test generator
        run: python3 -m unittest discover -s tests -v
      - name: Import admin upload
        if: github.event.inputs.upload_manifest != '' && github.event.inputs.upload_manifest != null
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_MANIFEST: ${{ github.event.inputs.upload_manifest }}
        run: python3 scripts/import_upload.py
      - name: Import committed IPAs if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/source.py import --publish
      - name: Check official SideInstaller releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/source.py sync
      - name: Generate source
        run: python3 scripts/source.py render
      - name: Commit source updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source.json source-github.json catalog assets
          if ! git diff --cached --quiet; then
            git commit -m 'Update app source'
            git push
          fi
      - name: Build website
        run: python3 scripts/build_site.py
